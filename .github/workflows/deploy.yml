name: GitHub Pages

on:
  push:
    branches: [main, claude/clever-rubin-4oqk3g]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Güvenlik: PDF ve .book yayınlanmasın.
      - name: dist içinde kullanıcı verisi olmadığını doğrula
        run: |
          if find dist \( -iname '*.pdf' -o -path '*/.book*' \) | grep -q .; then echo "dist içinde PDF/.book var"; exit 1; fi
      - name: Kaynak kodda .book/PDF içe aktarımı yok
        run: |
          if grep -rnE "\.book/|\.pdf" src; then echo "src içinde .book/PDF başvurusu var"; exit 1; fi
      # .book CI'da yoktur (gitignore), bu adım orada yalnızca dosya adı denetimi yapar; yerelde metin de aranır.
      - name: dist denetimi (kitap metni sızıntısı)
        run: node scripts/check-dist.mjs
      - name: dist boyut bütçesi (yazı tipleri dahil)
        run: test "$(du -sk dist | cut -f1)" -lt 2500 || { echo "dist beklenenden büyük"; exit 1; }
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
