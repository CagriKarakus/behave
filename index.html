<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#752D2E" />
    <title>Davranış · Behave simülasyonları</title>
    <meta name="description" content="Sapolsky'nin Behave kitabını zaman ölçeklerine göre gezen, interaktif simülasyonlu Türkçe inceleme uygulaması." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='3' fill='%23752D2E'/%3E%3Ccircle cx='11' cy='16' r='4' fill='%23F3ECDF'/%3E%3Ccircle cx='22' cy='11' r='3' fill='%23596F75'/%3E%3Ccircle cx='22' cy='22' r='3' fill='%23A98B52'/%3E%3C/svg%3E" />
    <script>
      // Tema yanıp sönmesin diye: kayıtlı tercih varsa hemen uygula (hata olursa sistem teması).
      try {
        var t = localStorage.getItem('behave-theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
